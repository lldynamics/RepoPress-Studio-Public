name: WorkspaceAccessibilityUITests
options:
  bundleIdPrefix: com.jinfang.personal-site-publisher
  deploymentTarget:
    macOS: "14.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
targets:
  WorkspaceAccessibilityTestHost:
    type: application
    platform: macOS
    sources:
      - path: Host
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_LSBackgroundOnly: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.jinfang.personal-site-publisher.accessibility-test-host
  WorkspaceAccessibilityUITests:
    type: bundle.ui-testing
    platform: macOS
    sources:
      - path: WorkspaceAccessibilityUITests
    dependencies:
      - target: WorkspaceAccessibilityTestHost
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.jinfang.personal-site-publisher.accessibility-ui-tests
        SWIFT_EMIT_LOC_STRINGS: NO
schemes:
  WorkspaceAccessibilityUITests:
    build:
      targets:
        WorkspaceAccessibilityTestHost: all
        WorkspaceAccessibilityUITests: [test]
    test:
      targets:
        - WorkspaceAccessibilityUITests
