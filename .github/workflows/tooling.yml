name: Release Tooling CI

on:
  push:
    tags:
      - "v*"
  pull_request:
    paths:
      - "script/**"
      - ".github/workflows/**"
      - "package.json"
      - "package-lock.json"
      - "Package.swift"
      - "Packaging/**"
      - "BrowserExtension/**"
      - "Sources/BrowserExtensionProtocolSupport/**"
      - "Sources/PersonalSitePublisherMac/Support/KnowledgeBrowserBridge.swift"
      - "Sources/PersonalSitePublisherMac/Support/KnowledgeBrowserImportLedgerStore.swift"
      - "Sources/PersonalSitePublisherMac/App/WorkbenchLaunchCoordinator.swift"
      - "Sources/PersonalSitePublisherMac/Views/Knowledge/BrowserExtensionConnectionView.swift"
      - "Sources/PublishingWorkbenchCore/Models/**"
      - "Sources/PublishingWorkbenchCore/Services/KeychainTokenStore.swift"
      - "Sources/PublishingWorkbenchCore/Stores/KnowledgeStore.swift"
      - "Sources/PublishingCoreSupport/**"
      - "Sources/PublishingDomainContracts/**"
      - "Sources/PublishingMarkdownCore/**"
      - "Sources/PublishingGitCore/**"
      - "Sources/PublishingAICore/**"
      - "Sources/PublishingKnowledgeCore/**"
      - "Tests/PublishingWorkbenchCoreTests/BrowserExtensionProtocolTests.swift"
      - "Tests/PublishingWorkbenchCoreTests/KnowledgeBrowserImportOperationLedgerTests.swift"
      - "Tests/PublishingWorkbenchCoreTests/KnowledgeLibraryServiceTests.swift"
      - "Tests/PublishingCoreSupportTests/**"
      - "Tests/PublishingDomainContractsTests/**"
      - "Tests/PublishingMarkdownCoreTests/**"
      - "Tests/PublishingGitCoreTests/**"
      - "Tests/PublishingAICoreTests/**"
      - "Tests/PublishingKnowledgeCoreTests/**"
      - "Tests/PersonalSitePublisherMacTests/BrowserExtensionOriginPolicyTests.swift"
      - "Tests/PersonalSitePublisherMacTests/KnowledgeBrowserImportLedgerStoreTests.swift"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-tooling-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tooling-self-tests:
    runs-on: macos-15
    timeout-minutes: 30
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - name: Configure shared Playwright browser path
        run: echo "PLAYWRIGHT_BROWSERS_PATH=$RUNNER_TEMP/ms-playwright" >> "$GITHUB_ENV"
      - name: Verify Xcode toolchain
        run: xcodebuild -version
      - name: Configure deterministic test language
        run: |
          defaults write NSGlobalDomain AppleLanguages -array "zh-Hans"
          defaults write NSGlobalDomain AppleLocale "zh_CN"
      - name: Install pinned browser extension tooling
        run: |
          npm ci --ignore-scripts
          npx --no-install playwright-core install chromium
      - name: Verify Node dependency security
        run: |
          python3 script/check_node_toolchain_security.py
          python3 script/test_node_toolchain_security.py
          npm audit --audit-level=high --omit=optional
      - name: Run browser extension release gate
        run: |
          ./script/check_release_gate.sh \
            --check browser-extension-release \
            --result-json .build/browser-extension-gate-result.json \
            --summary-markdown .build/browser-extension-gate-summary.md
      - name: Upload real-browser extension evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: browser-extension-e2e
          path: output/playwright/browser-extension-e2e/
          if-no-files-found: warn
      - name: Build Chrome and Edge store submission ZIPs
        run: python3 script/chromium_extension_release.py package --output-dir .build/chromium-store
      - name: Run release-tooling self-tests
        run: |
          bash script/check_ci_quality_workflow.sh
          ./script/check_release_gate.sh \
            --tooling \
            --result-json .build/tooling-gate-result.json \
            --summary-markdown .build/tooling-gate-summary.md
      - name: Upload Chrome and Edge store submission ZIPs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: chromium-store-submission-zips
          path: .build/chromium-store/*.zip
          if-no-files-found: error
      - name: Upload unified result
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-tooling-result
          path: |
            .build/*gate-result.json
            .build/*gate-summary.md
            .build/*.diagnostics/
      - name: Publish release-tooling summary
        if: always()
        run: |
          for summary in \
            .build/browser-extension-gate-summary.md \
            .build/tooling-gate-summary.md; do
            if [[ -f "$summary" ]]; then
              cat "$summary" >>"$GITHUB_STEP_SUMMARY"
            fi
          done
