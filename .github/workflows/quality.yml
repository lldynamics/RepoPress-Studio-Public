name: Public Source Gate

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: public-source-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install public gate dependencies
        run: command -v rg >/dev/null 2>&1 || brew install ripgrep
      - name: Verify public repository boundary
        run: bash script/check_public_snapshot.sh .
      - name: Show toolchain
        run: swift --version
      - name: Build and test
        run: swift test
      - name: Verify pinned Node dependencies
        run: |
          npm ci --ignore-scripts
          npm audit --audit-level=high --omit=optional
