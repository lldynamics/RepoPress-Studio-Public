name: Quality Gate

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:
    inputs:
      risk_level:
        description: CI risk layer to run
        required: true
        default: release
        type: choice
        options:
          - quick
          - pr
          - release

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  main-push-quick:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/heads/')
    runs-on: macos-15
    timeout-minutes: 25
    env:
      SWIFT_BUILD_HOME: /private/tmp/personal-site-publisher-ci-swift-home
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - name: Configure deterministic test language
        run: |
          defaults write NSGlobalDomain AppleLanguages -array "zh-Hans"
          defaults write NSGlobalDomain AppleLocale "zh_CN"
      - name: Show toolchain
        run: |
          swift --version
          xcrun swift-format --version
      - name: Run main push quick gate
        run: |
          ./script/check_release_gate.sh \
            --quick \
            --result-json .build/main-push-quick-result.json \
            --summary-markdown .build/main-push-quick-summary.md
          cat .build/main-push-quick-summary.md >>"$GITHUB_STEP_SUMMARY"
      - name: Upload main push result
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: main-push-quick-result
          path: |
            .build/main-push-quick-result.json
            .build/main-push-quick-summary.md
            .build/swift-test-shards/

  quality-quick:
    if: >-
      github.event_name == 'pull_request' ||
      startsWith(github.ref, 'refs/tags/v') ||
      github.event_name == 'workflow_dispatch'
    runs-on: macos-15
    timeout-minutes: 25
    env:
      SWIFT_BUILD_HOME: /private/tmp/personal-site-publisher-ci-quick-home
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - name: Configure deterministic test language
        run: |
          defaults write NSGlobalDomain AppleLanguages -array "zh-Hans"
          defaults write NSGlobalDomain AppleLocale "zh_CN"
      - name: Show toolchain
        run: swift --version
      - name: Run quick quality gate
        run: |
          ./script/check_release_gate.sh \
            --quick \
            --result-json .build/quality-gate-result.json \
            --summary-markdown .build/quality-gate-summary.md
      - name: Publish quick quality summary
        if: always()
        run: |
          if [[ -f .build/quality-gate-summary.md ]]; then
            cat .build/quality-gate-summary.md >>"$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload quick quality result
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: quality-quick-result
          path: |
            .build/quality-gate-result.json
            .build/quality-gate-summary.md
            .build/swift-test-shards/

  quality-coverage:
    if: >-
      github.event_name == 'pull_request' ||
      startsWith(github.ref, 'refs/tags/v') ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.risk_level != 'quick')
    runs-on: macos-15
    timeout-minutes: 45
    env:
      SWIFT_BUILD_HOME: /private/tmp/personal-site-publisher-ci-coverage-home
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - name: Configure deterministic test language
        run: |
          defaults write NSGlobalDomain AppleLanguages -array "zh-Hans"
          defaults write NSGlobalDomain AppleLocale "zh_CN"
      - name: Show toolchain
        run: swift --version
      - name: Measure Swift Sources line coverage
        run: |
          ./script/check_release_gate.sh \
            --check swift-coverage \
            --result-json .build/coverage-gate-result.json \
            --summary-markdown .build/coverage-gate-summary.md
      - name: Publish coverage summary
        if: always()
        run: |
          if [[ -f .build/coverage-gate-summary.md ]]; then
            cat .build/coverage-gate-summary.md >>"$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload coverage result
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: quality-coverage-result
          path: |
            .build/coverage-gate-result.json
            .build/coverage-gate-summary.md

  quality-build:
    if: >-
      github.event_name == 'pull_request' ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.risk_level == 'pr')
    runs-on: macos-15
    timeout-minutes: 35
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
      SWIFT_BUILD_HOME: /private/tmp/personal-site-publisher-ci-build-home
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - name: Configure deterministic test language
        run: |
          defaults write NSGlobalDomain AppleLanguages -array "zh-Hans"
          defaults write NSGlobalDomain AppleLocale "zh_CN"
      - name: Exercise distribution build and package path
        run: |
          xcodebuild -version
          xcrun -f safari-web-extension-packager
          ./script/check_release_gate.sh \
            --check ui-runtime \
            --check swift-release-build \
            --result-json .build/distribution-gate-result.json \
            --summary-markdown .build/distribution-gate-summary.md
      - name: Publish distribution summary
        if: always()
        run: |
          if [[ -f .build/distribution-gate-summary.md ]]; then
            cat .build/distribution-gate-summary.md >>"$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload PR build result
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: quality-build-result
          path: |
            .build/distribution-gate-result.json
            .build/distribution-gate-summary.md

  quality-runtime:
    if: >-
      startsWith(github.ref, 'refs/tags/v') ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.risk_level == 'release')
    runs-on: macos-15
    timeout-minutes: 75
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
      SWIFT_BUILD_HOME: /private/tmp/personal-site-publisher-ci-runtime-home
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - name: Configure deterministic test language
        run: |
          defaults write NSGlobalDomain AppleLanguages -array "zh-Hans"
          defaults write NSGlobalDomain AppleLocale "zh_CN"
      - name: Exercise release distribution build and package path
        run: |
          xcodebuild -version
          xcrun -f safari-web-extension-packager
          ./script/check_release_gate.sh \
            --check ui-runtime \
            --check swift-release-build \
            --result-json .build/distribution-gate-result.json \
            --summary-markdown .build/distribution-gate-summary.md
      - name: Publish release distribution summary
        if: always()
        run: |
          if [[ -f .build/distribution-gate-summary.md ]]; then
            cat .build/distribution-gate-summary.md >>"$GITHUB_STEP_SUMMARY"
          fi
      - name: Run real launch and UI smoke
        env:
          PERSONAL_SITE_PUBLISHER_RUNTIME_HOME: ${{ runner.temp }}/repopress-ui-smoke-home
          WORKBENCH_XCUI_DERIVED_DATA_PATH: ${{ github.workspace }}/.build/ui-smoke-derived-data
          WORKBENCH_XCUI_RETRY_FAILURES: 1
        run: |
          mkdir -p "$PERSONAL_SITE_PUBLISHER_RUNTIME_HOME" .build
          exec > >(tee .build/ui-smoke.log) 2>&1
          bash script/check_ui_runtime.sh --launch
          env -u RELEASE_GATE_PROFILE bash script/check_accessibility_runtime.sh
          WORKBENCH_XCUI_APP_PATH="$PWD/dist/PersonalSitePublisherMac.app" \
            bash script/check_accessibility_runtime.sh --non-screenshot-regression
          cat > .build/ui-smoke-summary.md <<'EOF'
          # UI Smoke Summary

          - Packaged app launch: passed
          - Visible main-window verification: passed
          - Complete isolated macOS accessibility XCUITest suite: passed
          - Non-screenshot XCUITest regression: passed
          EOF
          cat .build/ui-smoke-summary.md >> "$GITHUB_STEP_SUMMARY"
      - name: Upload UI smoke evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-ui-smoke-result
          path: |
            .build/ui-smoke.log
            .build/ui-smoke-summary.md
            .build/ui-smoke-derived-data/Logs/Test
          if-no-files-found: warn
      - name: Upload release runtime result
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-runtime-result
          path: |
            .build/distribution-gate-result.json
            .build/distribution-gate-summary.md

  quality:
    if: >-
      always() &&
      (github.event_name == 'pull_request' ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.risk_level == 'pr'))
    needs:
      - quality-quick
      - quality-coverage
      - quality-build
      - swift6-migration
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every PR quality lane
        env:
          QUICK_RESULT: ${{ needs.quality-quick.result }}
          COVERAGE_RESULT: ${{ needs.quality-coverage.result }}
          BUILD_RESULT: ${{ needs.quality-build.result }}
          SWIFT6_RESULT: ${{ needs.swift6-migration.result }}
        run: |
          printf 'quick=%s\ncoverage=%s\nbuild=%s\nswift6=%s\n' \
            "$QUICK_RESULT" "$COVERAGE_RESULT" "$BUILD_RESULT" "$SWIFT6_RESULT"
          [[ "$QUICK_RESULT" == "success" ]]
          [[ "$COVERAGE_RESULT" == "success" ]]
          [[ "$BUILD_RESULT" == "success" ]]
          [[ "$SWIFT6_RESULT" == "success" ]]

  release-performance:
    if: >-
      startsWith(github.ref, 'refs/tags/v') ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.risk_level == 'release')
    runs-on: macos-15
    timeout-minutes: 45
    env:
      SWIFT_BUILD_HOME: /private/tmp/personal-site-publisher-performance-swift-home
      PERFORMANCE_BENCHMARK_REQUIRED: "1"
      PERFORMANCE_BENCHMARK_CONFIGURATION: release
      PERFORMANCE_BENCHMARK_ENFORCE_WALL_TIME: "0"
      PERFORMANCE_BENCHMARK_ITERATIONS: "7"
      SITE_MAINTENANCE_RELATION_BENCHMARK_SIZES: "512,2048,4096"
      SITE_MAINTENANCE_RELATION_BENCHMARK_LABEL_GROUP_SIZE: "8"
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - name: Show Release performance configuration
        run: |
          swift --version
          uname -a
          printf 'configuration=%s iterations=%s wall_time_policy=trend-only\n' \
            "$PERFORMANCE_BENCHMARK_CONFIGURATION" \
            "$PERFORMANCE_BENCHMARK_ITERATIONS"
      - name: Run independent Release performance lane
        run: |
          mkdir -p .build
          ./script/check_release_gate.sh \
            --check release-performance \
            --result-json .build/release-performance-gate-result.json \
            --summary-markdown .build/release-performance-gate-summary.md
          cat .build/release-performance-gate-summary.md >>"$GITHUB_STEP_SUMMARY"
      - name: Upload Release performance evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-performance
          path: |
            .build/release-performance/
            .build/release-performance-gate-result.json
            .build/release-performance-gate-summary.md
          if-no-files-found: warn

  swift6-migration:
    if: >-
      github.event_name == 'pull_request' ||
      startsWith(github.ref, 'refs/tags/v') ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.risk_level != 'quick')
    runs-on: macos-15
    timeout-minutes: 25
    env:
      SWIFT_BUILD_HOME: /private/tmp/personal-site-publisher-ci-swift6-home
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - name: Verify migration diagnostic contract
        run: bash script/test_swift6_migration_gate.sh
      - name: Build in true Swift 6 language mode
        run: |
          mkdir -p .build
          set -o pipefail
          bash script/check_swift6_migration.sh 2>&1 | tee .build/swift6-migration.log
      - name: Publish migration status
        if: always()
        run: |
          {
            echo "# Swift 6 Migration Diagnostic"
            echo
            echo "This blocking job compiles with \`-swift-version 6\`; PR and release gates remain blocked until migration errors are resolved."
          } >>"$GITHUB_STEP_SUMMARY"
      - name: Upload Swift 6 migration diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: swift6-migration-diagnostic
          path: .build/swift6-migration.log
          if-no-files-found: error

  release-quality:
    if: >-
      always() &&
      (startsWith(github.ref, 'refs/tags/v') ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.risk_level == 'release'))
    needs:
      - quality-quick
      - quality-coverage
      - quality-runtime
      - release-performance
      - swift6-migration
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every release quality lane
        env:
          QUICK_RESULT: ${{ needs.quality-quick.result }}
          COVERAGE_RESULT: ${{ needs.quality-coverage.result }}
          RUNTIME_RESULT: ${{ needs.quality-runtime.result }}
          PERFORMANCE_RESULT: ${{ needs.release-performance.result }}
          SWIFT6_RESULT: ${{ needs.swift6-migration.result }}
        run: |
          printf 'quick=%s\ncoverage=%s\nruntime=%s\nperformance=%s\nswift6=%s\n' \
            "$QUICK_RESULT" "$COVERAGE_RESULT" "$RUNTIME_RESULT" \
            "$PERFORMANCE_RESULT" "$SWIFT6_RESULT"
          [[ "$QUICK_RESULT" == "success" ]]
          [[ "$COVERAGE_RESULT" == "success" ]]
          [[ "$RUNTIME_RESULT" == "success" ]]
          [[ "$PERFORMANCE_RESULT" == "success" ]]
          [[ "$SWIFT6_RESULT" == "success" ]]
