name: Tauri desktop

on:
  pull_request:
    paths:
      - "Apps/RepoPressDesktop/**"
      - ".github/workflows/tauri-desktop.yml"
  push:
    branches:
      - main
    paths:
      - "Apps/RepoPressDesktop/**"
      - ".github/workflows/tauri-desktop.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tauri-desktop-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ubuntu:
    name: Ubuntu 24.04 checks
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: Apps/RepoPressDesktop

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: Apps/RepoPressDesktop/.node-version
          cache: npm
          cache-dependency-path: Apps/RepoPressDesktop/package-lock.json

      - name: Install Linux desktop dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends \
            build-essential \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev

      - name: Install frontend dependencies
        run: npm ci

      - name: Test frontend
        run: npm test -- --run

      - name: Build frontend
        run: npm run build

      - name: Check Rust formatting
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --all -- --check

      - name: Test Rust backend
        run: cargo test --manifest-path src-tauri/Cargo.toml --locked

      - name: Lint Rust backend
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets --locked -- -D warnings
