name: Shared .NET Core

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/shared-dotnet-core.yml"
      - "Shared/RepoPressCoreContracts/.gitattributes"
      - "Shared/RepoPressCoreContracts/contracts/**"
      - "Shared/RepoPressCoreContracts/dotnet/**"
      - "Shared/RepoPressCoreContracts/scripts/check_dotnet_core_boundaries.py"
      - "Shared/RepoPressCoreContracts/tests/test_dotnet_core_boundary_gate.py"
  pull_request:
    paths:
      - ".github/workflows/shared-dotnet-core.yml"
      - "Shared/RepoPressCoreContracts/.gitattributes"
      - "Shared/RepoPressCoreContracts/contracts/**"
      - "Shared/RepoPressCoreContracts/dotnet/**"
      - "Shared/RepoPressCoreContracts/scripts/check_dotnet_core_boundaries.py"
      - "Shared/RepoPressCoreContracts/tests/test_dotnet_core_boundary_gate.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dotnet-core:
    name: .NET Core boundary and contract harness
    runs-on: windows-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: Shared/RepoPressCoreContracts
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Set up .NET 10 GA
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: "10.0.x"
          dotnet-quality: ga
      - name: Run .NET boundary tests
        run: python -m unittest tests.test_dotnet_core_boundary_gate -v
      - name: Check .NET Core boundary
        run: python scripts/check_dotnet_core_boundaries.py
      - name: Build contract harness (Release)
        run: dotnet build dotnet/tests/RepoPress.Core.ContractTests/RepoPress.Core.ContractTests.csproj -c Release
      - name: Run contract harness
        run: dotnet run --project dotnet/tests/RepoPress.Core.ContractTests/RepoPress.Core.ContractTests.csproj -c Release --no-build
