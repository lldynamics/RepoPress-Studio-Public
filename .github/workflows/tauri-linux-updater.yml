name: Tauri signed Linux updater

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tauri-linux-updater-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-policy:
    name: Trusted release tag policy
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    defaults:
      run:
        working-directory: Apps/RepoPressDesktop
    steps:
      - name: Check out complete tagged history
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: Apps/RepoPressDesktop/.node-version

      # This job has no signing environment and no signing secrets. A branch,
      # mismatched version tag, detached SHA, or off-main tag stops here.
      - name: Require version tag on origin default branch
        env:
          REPOPRESS_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: npm run check:updater-release

  unsigned-appimage:
    name: Unsigned AppImage updater candidate
    needs: release-policy
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    defaults:
      run:
        working-directory: Apps/RepoPressDesktop
    steps:
      - name: Check out trusted release tag
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: Apps/RepoPressDesktop/.node-version
          cache: npm
          cache-dependency-path: Apps/RepoPressDesktop/package-lock.json

      - name: Install Linux release dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends \
            build-essential \
            libayatana-appindicator3-dev \
            libfuse2 \
            librsvg2-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            patchelf

      - name: Install frontend dependencies
        run: npm ci

      - name: Validate source and release metadata without signing secrets
        run: |
          npm run check:version
          npm test -- --run
          bash scripts/ci/test-linux-ci-scripts.sh
          cargo test --manifest-path src-tauri/Cargo.toml --locked

      - name: Validate private-key-free updater configuration
        env:
          REPOPRESS_UPDATER_PUBKEY: ${{ vars.REPOPRESS_UPDATER_PUBKEY }}
          REPOPRESS_UPDATER_ENDPOINT: ${{ vars.REPOPRESS_UPDATER_ENDPOINT }}
        run: npm run check:updater

      - name: Build unsigned AppImage with updater public configuration
        env:
          REPOPRESS_UPDATER_PUBKEY: ${{ vars.REPOPRESS_UPDATER_PUBKEY }}
          REPOPRESS_UPDATER_ENDPOINT: ${{ vars.REPOPRESS_UPDATER_ENDPOINT }}
          NO_STRIP: "1"
        run: npm run build:updater

      - name: Upload unsigned candidate for isolated signing
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: repopress-linux-unsigned-updater-candidate
          if-no-files-found: error
          retention-days: 1
          path: |
            Apps/RepoPressDesktop/src-tauri/target/release/bundle/appimage/*.AppImage
            Apps/RepoPressDesktop/src-tauri/target/release/bundle/appimage/updater-public-key.txt

  sign-appimage:
    name: Sign and verify AppImage updater candidate
    needs: unsigned-appimage
    environment: linux-release-signing
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: Apps/RepoPressDesktop
    steps:
      - name: Check out trusted release scripts
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: Apps/RepoPressDesktop/.node-version
          cache: npm
          cache-dependency-path: Apps/RepoPressDesktop/package-lock.json

      # Lifecycle scripts do not run in the key-bearing job. The locked Tauri
      # CLI platform package is invoked directly only in the next step.
      - name: Install locked signer without lifecycle scripts
        run: npm ci --ignore-scripts

      - name: Download unsigned candidate
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: repopress-linux-unsigned-updater-candidate
          path: Apps/RepoPressDesktop/src-tauri/target/release/bundle/appimage

      - name: Sign the unique AppImage
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          mapfile -d '' -t appimages < <(find src-tauri/target/release/bundle/appimage \
            -maxdepth 1 -type f -name '*.AppImage' -print0)
          [[ ${#appimages[@]} -eq 1 ]]
          [[ -s "${appimages[0]}" ]]
          [[ ! -e "${appimages[0]}.sig" ]]
          node_modules/.bin/tauri signer sign "${appimages[0]}"
          [[ -s "${appimages[0]}.sig" ]]

      - name: Generate tag-bound updater manifest
        env:
          REPOPRESS_RELEASE_TAG: ${{ github.ref_name }}
          REPOPRESS_UPDATER_APPIMAGE_URL: ${{ vars.REPOPRESS_UPDATER_APPIMAGE_URL }}
        run: npm run manifest:updater

      - name: Cryptographically verify release-candidate chain
        run: |
          python3 scripts/ci/validate-updater-manifest.py \
            --bundle-dir src-tauri/target/release/bundle/appimage \
            --manifest src-tauri/target/release/bundle/appimage/latest.json \
            --version "$(node -p 'require("./package.json").version')" \
            --release-tag "${GITHUB_REF_NAME}" \
            --public-key src-tauri/target/release/bundle/appimage/updater-public-key.txt \
            --review-summary src-tauri/target/release/bundle/appimage/updater-review.json

      - name: Upload signed updater candidate for release review
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: repopress-linux-signed-updater
          if-no-files-found: error
          path: |
            Apps/RepoPressDesktop/src-tauri/target/release/bundle/appimage/*.AppImage
            Apps/RepoPressDesktop/src-tauri/target/release/bundle/appimage/*.AppImage.sig
            Apps/RepoPressDesktop/src-tauri/target/release/bundle/appimage/latest.json
            Apps/RepoPressDesktop/src-tauri/target/release/bundle/appimage/updater-public-key.txt
            Apps/RepoPressDesktop/src-tauri/target/release/bundle/appimage/updater-review.json
