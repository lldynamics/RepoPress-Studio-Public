name: Shared Contract Gates

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/shared-contracts.yml"
      - "Shared/RepoPressCoreContracts/contracts/**"
      - "Shared/RepoPressCoreContracts/requirements-contracts.txt"
      - "Shared/RepoPressCoreContracts/scripts/check_fixture_hygiene.py"
      - "Shared/RepoPressCoreContracts/scripts/validate_contracts.py"
      - "Shared/RepoPressCoreContracts/tests/**"
  pull_request:
    paths:
      - ".github/workflows/shared-contracts.yml"
      - "Shared/RepoPressCoreContracts/contracts/**"
      - "Shared/RepoPressCoreContracts/requirements-contracts.txt"
      - "Shared/RepoPressCoreContracts/scripts/check_fixture_hygiene.py"
      - "Shared/RepoPressCoreContracts/scripts/validate_contracts.py"
      - "Shared/RepoPressCoreContracts/tests/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contracts:
    name: Contracts (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-15
          - windows-latest
    defaults:
      run:
        working-directory: Shared/RepoPressCoreContracts
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install contract gate dependencies
        run: python -m pip install --requirement requirements-contracts.txt
      - name: Run contract gate tests
        run: python -m unittest discover -s tests -v
      - name: Validate contracts
        run: python scripts/validate_contracts.py
      - name: Check fixture hygiene
        run: python scripts/check_fixture_hygiene.py
