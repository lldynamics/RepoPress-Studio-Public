name: Shared Swift Core

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/shared-swift-core.yml"
      - "Shared/RepoPressCoreContracts/.gitattributes"
      - "Shared/RepoPressCoreContracts/contracts/**"
      - "Shared/RepoPressCoreContracts/requirements-contracts.txt"
      - "Shared/RepoPressCoreContracts/scripts/check_fixture_hygiene.py"
      - "Shared/RepoPressCoreContracts/scripts/check_swift_core_boundaries.py"
      - "Shared/RepoPressCoreContracts/scripts/validate_contracts.py"
      - "Shared/RepoPressCoreContracts/swift/**"
      - "Shared/RepoPressCoreContracts/tests/**"
  pull_request:
    paths:
      - ".github/workflows/shared-swift-core.yml"
      - "Shared/RepoPressCoreContracts/.gitattributes"
      - "Shared/RepoPressCoreContracts/contracts/**"
      - "Shared/RepoPressCoreContracts/requirements-contracts.txt"
      - "Shared/RepoPressCoreContracts/scripts/check_fixture_hygiene.py"
      - "Shared/RepoPressCoreContracts/scripts/check_swift_core_boundaries.py"
      - "Shared/RepoPressCoreContracts/scripts/validate_contracts.py"
      - "Shared/RepoPressCoreContracts/swift/**"
      - "Shared/RepoPressCoreContracts/tests/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  swift-core:
    name: Swift Core boundaries and consumers
    runs-on: macos-15
    timeout-minutes: 20
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    defaults:
      run:
        working-directory: Shared/RepoPressCoreContracts
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install contract gate dependencies
        run: python -m pip install --requirement requirements-contracts.txt
      - name: Run contract and boundary tests
        run: python -m unittest discover -s tests -v
      - name: Validate contracts
        run: python scripts/validate_contracts.py
      - name: Check fixture hygiene
        run: python scripts/check_fixture_hygiene.py
      - name: Check Swift Core boundary
        run: python scripts/check_swift_core_boundaries.py
      - name: Run Swift Core tests
        run: swift test --package-path swift
      - name: Cross-build Swift Core for iOS Simulator
        run: |
          sdk_path="$(xcrun --sdk iphonesimulator --show-sdk-path)"
          swift build --package-path swift \
            --triple arm64-apple-ios17.0-simulator \
            --sdk "$sdk_path" \
            --scratch-path "$RUNNER_TEMP/RepoPressCoreIOSBuild"

  swift-core-linux:
    name: Swift Core on Ubuntu
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    container:
      image: swift:6.3.3-noble
    defaults:
      run:
        working-directory: Shared/RepoPressCoreContracts
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - name: Check Swift toolchain
        run: swift --version
      - name: Check package manifest and graph
        run: |
          swift package dump-package --package-path swift \
            --scratch-path "$RUNNER_TEMP/RepoPressCoreLinuxBuild"
          swift package show-dependencies --package-path swift \
            --scratch-path "$RUNNER_TEMP/RepoPressCoreLinuxBuild"
      - name: Build Swift Core
        run: swift build --package-path swift \
          --scratch-path "$RUNNER_TEMP/RepoPressCoreLinuxBuild"
      - name: Test Swift Core
        run: swift test --package-path swift \
          --scratch-path "$RUNNER_TEMP/RepoPressCoreLinuxBuild"
